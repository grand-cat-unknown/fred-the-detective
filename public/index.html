<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Fred-The-Detective</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#login-screen {
	position: fixed;
	inset: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 1.5rem;
	background:
		radial-gradient(circle at top, rgba(136, 98, 68, 0.45), transparent 38%),
		linear-gradient(160deg, #16110d 0%, #26201a 50%, #111418 100%);
	z-index: 3;
}

#login-screen[hidden] {
	display: none;
}

.login-card {
	width: min(100%, 24rem);
	padding: 1.5rem;
	border-radius: 1rem;
	background: rgba(17, 17, 17, 0.86);
	border: 1px solid rgba(240, 213, 183, 0.22);
	box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.4);
	backdrop-filter: blur(12px);
}

.login-card h1 {
	margin: 0 0 0.5rem;
	font-size: 1.6rem;
}

.login-card p {
	margin: 0 0 1rem;
	color: rgba(255, 255, 255, 0.8);
	line-height: 1.5;
}

.login-card form {
	display: grid;
	gap: 0.85rem;
}

.login-card label {
	display: grid;
	gap: 0.35rem;
	font-size: 0.95rem;
}

.login-card input {
	padding: 0.8rem 0.9rem;
	border-radius: 0.7rem;
	border: 1px solid rgba(255, 255, 255, 0.16);
	background: rgba(255, 255, 255, 0.08);
	color: white;
	font: inherit;
}

.login-card input:focus {
	outline: 2px solid rgba(224, 181, 108, 0.9);
	outline-offset: 2px;
}

.login-card button,
#logout-button {
	padding: 0.85rem 1rem;
	border: 0;
	border-radius: 999px;
	background: linear-gradient(135deg, #d1a05d 0%, #9d6c39 100%);
	color: #121212;
	font: inherit;
	font-weight: 700;
	cursor: pointer;
}

.login-card button[disabled] {
	opacity: 0.7;
	cursor: wait;
}

#login-message {
	min-height: 1.3rem;
	margin: 0.75rem 0 0;
	font-size: 0.95rem;
	color: #ffb8b8;
}

#logout-button {
	position: fixed;
	right: 1rem;
	bottom: 1rem;
	z-index: 2;
	padding-inline: 1.1rem;
	box-shadow: 0 0.75rem 2rem rgba(0, 0, 0, 0.3);
}

#logout-button[hidden] {
	display: none;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<div id="login-screen">
			<div class="login-card">
				<h1>Fred the Detective</h1>
				<p>Sign in to start the case. This keeps casual visitors out before the Web build loads.</p>
				<form id="login-form">
					<label>
						<span>Username</span>
						<input id="login-username" name="username" type="text" autocomplete="username" required>
					</label>
					<label>
						<span>Password</span>
						<input id="login-password" name="password" type="password" autocomplete="current-password" required>
					</label>
					<button id="login-submit" type="submit">Enter</button>
				</form>
				<p id="login-message" aria-live="polite"></p>
			</div>
		</div>

		<button id="logout-button" type="button" hidden>Log out</button>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":11972,"index.wasm":35749181},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const loginScreen = document.getElementById('login-screen');
	const loginForm = document.getElementById('login-form');
	const loginSubmit = document.getElementById('login-submit');
	const loginMessage = document.getElementById('login-message');
	const loginUsername = document.getElementById('login-username');
	const logoutButton = document.getElementById('logout-button');
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let gameStarted = false;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.style.visibility = 'hidden';
			statusProgress.style.display = 'none';
			statusNotice.style.display = 'none';
			statusMode = mode;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
	}

	function setLoginMessage(text, isError = true) {
		loginMessage.textContent = text;
		loginMessage.style.color = isError ? '#ffb8b8' : '#d8f0bd';
	}

	async function requestJson(url, options = {}) {
		const response = await fetch(url, {
			credentials: 'same-origin',
			headers: {
				'Content-Type': 'application/json',
			},
			...options,
		});

		let payload = {};
		try {
			payload = await response.json();
		} catch {
			payload = {};
		}

		if (!response.ok) {
			const error = new Error(payload.error || 'Request failed.');
			error.status = response.status;
			throw error;
		}

		return payload;
	}

	function revealGame() {
		loginScreen.hidden = true;
		logoutButton.hidden = false;
	}

	function showLogin() {
		loginScreen.hidden = false;
		logoutButton.hidden = true;
		setStatusMode('hidden');
		loginUsername.focus();
	}

	async function startGame() {
		if (gameStarted) {
			revealGame();
			return;
		}

		setStatusMode('progress');
		await engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		});
		gameStarted = true;
		revealGame();
		setStatusMode('hidden');
	}

	async function verifySession() {
		try {
			await requestJson('/api/auth', { method: 'GET' });
			await startGame();
		} catch (error) {
			showLogin();
			if (error.status && error.status !== 401) {
				setLoginMessage(error.message || 'Login is unavailable right now.');
			}
		}
	}

	loginForm.addEventListener('submit', async (event) => {
		event.preventDefault();
		loginSubmit.disabled = true;
		setLoginMessage('Checking credentials...', false);

		const formData = new FormData(loginForm);
		const username = String(formData.get('username') || '');
		const password = String(formData.get('password') || '');

		try {
			await requestJson('/api/auth', {
				method: 'POST',
				body: JSON.stringify({ username, password }),
			});
			setLoginMessage('Access granted. Loading game...', false);
			await startGame();
		} catch (error) {
			setLoginMessage(error.message || 'Login failed.');
		} finally {
			loginSubmit.disabled = false;
		}
	});

	logoutButton.addEventListener('click', async () => {
		logoutButton.disabled = true;
		try {
			await requestJson('/api/auth', { method: 'DELETE' });
			window.location.reload();
		} catch (error) {
			setLoginMessage(error.message || 'Logout failed.');
			showLogin();
			logoutButton.disabled = false;
		}
	});

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		verifySession().catch(displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
