<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Fred-The-Detective</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#auth-overlay {
	position: fixed;
	inset: 0;
	background: rgba(12, 12, 12, 0.84);
	display: none;
	align-items: center;
	justify-content: center;
	z-index: 3;
	padding: 1.5rem;
	box-sizing: border-box;
}

#auth-card {
	width: min(420px, 100%);
	background: #1d1d1d;
	border: 1px solid #474747;
	border-radius: 0.75rem;
	padding: 1.25rem;
	box-sizing: border-box;
	box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	color: #f3f3f3;
}

#auth-card h1 {
	margin: 0 0 0.5rem;
	font-size: 1.8rem;
}

#auth-card p {
	margin: 0 0 1rem;
	color: #d0d0d0;
	line-height: 1.45;
}

#auth-form {
	display: flex;
	flex-direction: column;
	gap: 0.75rem;
}

#auth-form input,
#auth-form button {
	font: inherit;
	border-radius: 0.5rem;
	border: 1px solid #5b5b5b;
	padding: 0.8rem 0.9rem;
	box-sizing: border-box;
}

#auth-form input {
	background: #111;
	color: #fff;
}

#auth-actions {
	display: flex;
	gap: 0.75rem;
}

#auth-form button {
	background: #f3f3f3;
	color: #111;
	font-weight: 700;
	cursor: pointer;
	flex: 1 1 auto;
}

#auth-reset {
	background: #2d2d2d !important;
	color: #f3f3f3 !important;
}

#auth-form button[disabled] {
	opacity: 0.6;
	cursor: wait;
}

#auth-error {
	min-height: 1.4rem;
	color: #ff9b9b;
	font-size: 0.95rem;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<div id="auth-overlay">
			<div id="auth-card">
				<h1>Fred the Detective</h1>
				<p>Sign in before entering the case.</p>
				<form id="auth-form">
					<input id="auth-username" name="username" type="text" placeholder="Username" autocomplete="username" required>
					<input id="auth-password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
					<div id="auth-error"></div>
					<div id="auth-actions">
						<button id="auth-submit" type="submit">Enter</button>
						<button id="auth-reset" type="button">Reset Session</button>
					</div>
				</form>
			</div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":21881124,"index.wasm":37695054},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const authOverlay = document.getElementById('auth-overlay');
	const authForm = document.getElementById('auth-form');
	const authUsername = document.getElementById('auth-username');
	const authPassword = document.getElementById('auth-password');
	const authSubmit = document.getElementById('auth-submit');
	const authReset = document.getElementById('auth-reset');
	const authError = document.getElementById('auth-error');

	let gameStarted = false;

	function setStatusMode(mode) {
		if (mode === 'hidden') {
			statusOverlay.style.display = 'none';
			return;
		}

		statusOverlay.style.display = 'flex';
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
	}

	function removeStatusOverlay() {
		if (statusOverlay.parentNode) {
			statusOverlay.remove();
		}
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
	}

	function setAuthVisible(visible) {
		authOverlay.style.display = visible ? 'flex' : 'none';
		if (visible) {
			authUsername.focus();
		}
	}

	function setAuthBusy(isBusy) {
		authUsername.disabled = isBusy;
		authPassword.disabled = isBusy;
		authSubmit.disabled = isBusy;
		authReset.disabled = isBusy;
		authSubmit.textContent = isBusy ? 'Checking...' : 'Enter';
	}

	function setAuthError(message) {
		authError.textContent = message || '';
	}

	async function authRequest(method, body) {
		const response = await fetch('/api/auth', {
			method,
			headers: body ? { 'Content-Type': 'application/json' } : undefined,
			credentials: 'same-origin',
			cache: 'no-store',
			body: body ? JSON.stringify(body) : undefined,
		});

		let data = {};
		try {
			data = await response.json();
		} catch (error) {
			data = {};
		}

		return { response, data };
	}

	async function resetSession(showMessage) {
		setAuthBusy(true);
		setAuthError('');
		try {
			await authRequest('DELETE');
			authPassword.value = '';
			if (showMessage) {
				setAuthError('Session cleared. Sign in again.');
			}
		} catch (error) {
			console.error(error);
			setAuthError('Could not clear the current session.');
		} finally {
			setAuthBusy(false);
			setAuthVisible(true);
		}
	}

	async function ensureAuthenticated() {
		try {
			const { response, data } = await authRequest('GET');
			if (response.ok && data && data.authenticated === true) {
				return true;
			}

			setAuthError(data && data.error ? data.error : 'Sign in to continue.');
		} catch (error) {
			console.error(error);
			setAuthError('Could not reach /api/auth.');
		}

		setStatusMode('hidden');
		setAuthVisible(true);
		return false;
	}

	async function startGodot() {
		if (gameStarted) {
			return;
		}

		gameStarted = true;
		setAuthVisible(false);
		setStatusMode('progress');

		try {
			await engine.startGame({
				'onProgress': function (current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
					} else {
						statusProgress.removeAttribute('value');
						statusProgress.removeAttribute('max');
					}
				},
			});
			removeStatusOverlay();
		} catch (error) {
			gameStarted = false;
			displayFailureNotice(error);
		}
	}

	authForm.addEventListener('submit', async function (event) {
		event.preventDefault();
		setAuthError('');
		setAuthBusy(true);

		try {
			const { response, data } = await authRequest('POST', {
				username: authUsername.value,
				password: authPassword.value,
			});

			if (!response.ok || !data || data.authenticated !== true) {
				setAuthError(data && data.error ? data.error : 'Authentication failed.');
				setAuthBusy(false);
				return;
			}

			authPassword.value = '';
			setAuthBusy(false);
			await startGodot();
		} catch (error) {
			console.error(error);
			setAuthError('Could not reach /api/auth.');
			setAuthBusy(false);
		}
	});

	authReset.addEventListener('click', function () {
		resetSession(true);
	});

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		ensureAuthenticated().then((authenticated) => {
			if (authenticated) {
				return startGodot();
			}
			return undefined;
		}).catch(displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
